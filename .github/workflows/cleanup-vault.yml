# Deletes My-files PDFs 2 hours after they were sent.
# Runs on a timer, and also on every change to this repository (e.g. each time a file is
# sent), so a delayed or skipped timer is caught up the next time anything happens here.
# Off-the-hour minutes avoid GitHub's busiest moments, when timed jobs get dropped.
name: Delete expired files

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vault-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete expired files
        run: python3 .github/cleanup_vault.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain vault)" ]; then
            git config user.name "file-cleanup-bot"
            git config user.email "file-cleanup-bot@users.noreply.github.com"
            git add -A vault
            git commit -m "Delete expired files"
            git push
          fi
